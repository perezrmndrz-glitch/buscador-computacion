<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuscaCompu — Ayuda de computación</title>
<style>
:root{--blue:#2457c5;--ink:#17233b;--muted:#63718a;--bg:#f3f6fc;--line:#dce4f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,#163d91,#3679e5);color:#fff;padding:30px 16px 35px;text-align:center}
header .logo{font-size:38px}h1{margin:3px 0;font-size:clamp(26px,5vw,38px)}header p{margin:5px auto 20px;max-width:650px;color:#eaf1ff}
.search{display:flex;gap:8px;max-width:760px;margin:auto;background:white;padding:7px;border-radius:15px;box-shadow:0 8px 25px #0b286633}
.search input{min-width:0;flex:1;border:0;outline:0;padding:13px 12px;font-size:17px;color:#17233b}.search button,button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 17px;font-weight:700;cursor:pointer}
main{max-width:960px;margin:24px auto;padding:0 15px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 20px}.chips button{background:#e1eaff;color:#234b9f;padding:9px 13px}.chips button.active{background:var(--blue);color:white}
#status{color:var(--muted);margin:12px 0}.result{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin:13px 0;box-shadow:0 3px 12px #142c5010}.result h2{font-size:20px;margin:0 0 8px;color:#1c469f}.tag{font-size:12px;background:#edf2ff;color:#3157a1;border-radius:20px;padding:4px 9px;display:inline-block;margin-bottom:9px}.result p{margin:7px 0}.result ul{padding-left:22px;margin:8px 0}.kbd{display:inline-block;background:#f4f6f9;border:1px solid #cbd3df;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:14px ui-monospace,monospace;white-space:nowrap}.empty{background:#fff;border:1px dashed #bac8df;border-radius:14px;padding:22px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:13px;padding:25px}
@media(max-width:520px){.search{flex-wrap:wrap}.search input{flex-basis:100%}.search button{width:100%}.result{padding:16px}}
</style></head>
<body>
<header><div class="logo">⌕💻</div><h1>BuscaCompu</h1><p>Buscador de computación para preparatoria: Word, Excel, PowerPoint, Windows, internet, programación y más.</p>
<form class="search" id="form"><input id="query" placeholder="Ej. atajo para guardar en Word" aria-label="Buscar en computación"><button>Buscar</button></form>
</header>
<main><div class="chips" id="chips"></div><div id="status">Explora un tema o escribe tu pregunta.</div><section id="results"></section></main>
<footer>Contenido educativo de consulta. Los atajos pueden variar según el sistema operativo o la versión del programa.</footer>
<script>
const knowledge=[
{cat:'Word',title:'Atajos básicos de Microsoft Word (Windows)',keys:'word microsoft documento atajos teclado comandos',body:'Los atajos más usados para editar documentos:',list:['<span class="kbd">Ctrl</span> + <span class="kbd">N</span>: crear un documento nuevo.','<span class="kbd">Ctrl</span> + <span class="kbd">O</span>: abrir un documento.','<span class="kbd">Ctrl</span> + <span class="kbd">S</span>: guardar.','<span class="kbd">Ctrl</span> + <span class="kbd">P</span>: imprimir.','<span class="kbd">Ctrl</span> + <span class="kbd">Z</span>: deshacer.','<span class="kbd">Ctrl</span> + <span class="kbd">Y</span>: rehacer.','<span class="kbd">Ctrl</span> + <span class="kbd">C</span>: copiar; <span class="kbd">Ctrl</span> + <span class="kbd">X</span>: cortar; <span class="kbd">Ctrl</span> + <span class="kbd">V</span>: pegar.','<span class="kbd">Ctrl</span> + <span class="kbd">A</span>: seleccionar todo.']},
{cat:'Word',title:'Formato de texto en Word',keys:'word negrita cursiva subrayado formato letra texto',body:'Atajos para dar formato al texto seleccionado:',list:['<span class="kbd">Ctrl</span> + <span class="kbd">B</span>: negrita.','<span class="kbd">Ctrl</span> + <span class="kbd">I</span>: cursiva.','<span class="kbd">Ctrl</span> + <span class="kbd">U</span>: subrayado.','<span class="kbd">Ctrl</span> + <span class="kbd">E</span>: centrar párrafo.','<span class="kbd">Ctrl</span> + <span class="kbd">L</span>: alinear a la izquierda.','<span class="kbd">Ctrl</span> + <span class="kbd">J</span>: justificar.']},
{cat:'Word',title:'Buscar, reemplazar y revisar en Word',keys:'word buscar reemplazar ortografía revisar localizar',body:'Funciones para localizar o corregir texto:',list:['<span class="kbd">Ctrl</span> + <span class="kbd">F</span>: buscar una palabra o frase.','<span class="kbd">Ctrl</span> + <span class="kbd">H</span>: buscar y reemplazar texto.','<span class="kbd">F7</span>: abrir revisión de ortografía y gramática en muchas versiones.','Para insertar un salto de página: <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span>.']},
{cat:'Excel',title:'Atajos y fórmulas de Excel',keys:'excel hoja calculo formulas atajos suma promedio',body:'Atajos útiles y fórmulas iniciales:',list:['<span class="kbd">Ctrl</span> + <span class="kbd">S</span>: guardar el libro.','<span class="kbd">Ctrl</span> + <span class="kbd">1</span>: abrir formato de celdas.','<span class="kbd">Alt</span> + <span class="kbd">=</span>: insertar Autosuma.','<code>=SUMA(A1:A5)</code>: suma los valores de A1 a A5.','<code>=PROMEDIO(A1:A5)</code>: calcula el promedio.','<code>=MAX(A1:A5)</code> y <code>=MIN(A1:A5)</code>: encuentran el mayor y el menor valor.']},
{cat:'PowerPoint',title:'Atajos de PowerPoint',keys:'powerpoint presentacion diapositivas atajos',body:'Comandos comunes al preparar o exponer una presentación:',list:['<span class="kbd">Ctrl</span> + <span class="kbd">M</span>: nueva diapositiva.','<span class="kbd">F5</span>: iniciar presentación desde el principio.','<span class="kbd">Shift</span> + <span class="kbd">F5</span>: iniciar desde la diapositiva actual.','Durante la presentación, <span class="kbd">Esc</span>: salir.','<span class="kbd">Ctrl</span> + <span class="kbd">S</span>: guardar.']},
{cat:'Windows',title:'Atajos esenciales de Windows',keys:'windows computadora pc atajos escritorio administrador archivos',body:'Combinaciones útiles del sistema Windows:',list:['<span class="kbd">Win</span> + <span class="kbd">E</span>: abrir el Explorador de archivos.','<span class="kbd">Win</span> + <span class="kbd">D</span>: mostrar u ocultar el escritorio.','<span class="kbd">Win</span> + <span class="kbd">L</span>: bloquear la computadora.','<span class="kbd">Alt</span> + <span class="kbd">Tab</span>: cambiar de ventana.','<span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">Esc</span>: abrir el Administrador de tareas.','<span class="kbd">Win</span> + <span class="kbd">Shift</span> + <span class="kbd">S</span>: capturar una parte de la pantalla.']},
{cat:'Internet',title:'Internet, navegador y búsquedas',keys:'internet navegador google chrome buscador web url',body:'Conceptos básicos para navegar:',list:['Internet es una red mundial que conecta dispositivos y permite intercambiar información.','Un navegador (Chrome, Edge o Firefox) es el programa que abre páginas web.','Un buscador (Google o Bing) ayuda a encontrar páginas e información.','Una URL es la dirección de un recurso en internet, por ejemplo una página web.','Para buscar mejor, escribe palabras clave concretas y compara más de una fuente.']},
{cat:'Seguridad',title:'Seguridad informática y contraseñas',keys:'seguridad virus malware contraseña phishing privacidad computadora',body:'Recomendaciones para cuidar tus cuentas y dispositivos:',list:['Usa contraseñas largas y distintas para cada cuenta.','Activa la verificación en dos pasos cuando esté disponible.','No abras archivos o enlaces sospechosos.','El phishing intenta engañarte para que entregues datos o contraseñas.','Actualiza el sistema y las aplicaciones; realiza copias de seguridad.']},
{cat:'Computación',title:'Hardware y software',keys:'hardware software partes computadora componentes',body:'Una computadora se compone de elementos físicos y programas:',list:['Hardware: partes que puedes tocar, como teclado, monitor, memoria RAM y procesador.','Software: programas e instrucciones, como Windows, Word o un navegador.','CPU o procesador: ejecuta instrucciones y coordina operaciones.','RAM: memoria temporal usada mientras los programas están abiertos.','SSD o disco duro: almacenamiento de archivos y programas a largo plazo.']},
{cat:'Computación',title:'Dispositivos de entrada, salida y almacenamiento',keys:'entrada salida perifericos teclado mouse monitor impresora memoria usb',body:'Los periféricos se clasifican según su función:',list:['Entrada: teclado, mouse, micrófono y escáner.','Salida: monitor, impresora y bocinas.','Entrada y salida: pantalla táctil y algunos dispositivos de red.','Almacenamiento: SSD, disco duro, memoria USB y tarjeta SD.']},
{cat:'Programación',title:'Conceptos básicos de programación',keys:'programacion codigo algoritmo variable condicional ciclo',body:'Ideas fundamentales para crear programas:',list:['Algoritmo: conjunto ordenado de pasos para resolver un problema.','Variable: espacio con nombre que guarda un dato.','Condicional: permite tomar decisiones, por ejemplo <code>if</code>.','Ciclo o bucle: repite instrucciones mientras se cumpla una condición.','Depurar: encontrar y corregir errores en un programa.']},
{cat:'Comandos',title:'Comandos básicos de CMD en Windows',keys:'cmd terminal consola comandos ipconfig ping dir cd mkdir',body:'Comandos que puedes escribir en la consola de Windows:',list:['<code>dir</code>: muestra archivos y carpetas de la ubicación actual.','<code>cd nombre</code>: entra a una carpeta; <code>cd ..</code>: sube un nivel.','<code>mkdir nombre</code>: crea una carpeta.','<code>ipconfig</code>: muestra información de la conexión de red.','<code>ping ejemplo.com</code>: prueba la comunicación con un servidor.','Usa comandos con cuidado; evita ejecutar instrucciones que no entiendas.']},
{cat:'Computación',title:'Tipos de archivos y extensiones',keys:'archivo extensiones pdf docx xlsx pptx jpg png',body:'La extensión suele indicar el tipo de archivo:',list:['<code>.docx</code>: documento de Word.','<code>.xlsx</code>: libro de Excel.','<code>.pptx</code>: presentación de PowerPoint.','<code>.pdf</code>: documento con formato portátil.','<code>.jpg</code> y <code>.png</code>: imágenes.','<code>.zip</code>: archivo comprimido.']},
{cat:'Computación',title:'Redes: LAN, WAN, Wi-Fi y router',keys:'redes lan wan wifi router modem internet',body:'Una red conecta dispositivos para compartir datos o recursos:',list:['LAN: red local, como la de una casa o escuela.','WAN: red de gran alcance que conecta redes distantes.','Wi-Fi: tecnología inalámbrica para conectarse a una red.','Router: dirige el tráfico entre redes.','Módem: conecta la red local con el servicio del proveedor, según la tecnología.']},
{cat:'Word',title:'Cómo crear una tabla en Word',keys:'word tabla insertar filas columnas',body:'Pasos para insertar una tabla:',list:['Abre la pestaña Insertar.','Selecciona Tabla.','Elige la cantidad de filas y columnas.','Escribe la información en las celdas y usa Diseño de tabla para cambiar su apariencia.']},
{cat:'Excel',title:'Qué son filas, columnas y celdas en Excel',keys:'excel fila columna celda libro hoja',body:'En una hoja de cálculo:',list:['Las filas se identifican con números (1, 2, 3…).','Las columnas se identifican con letras (A, B, C…).','Una celda es la intersección de una fila y una columna; por ejemplo, B3.','Un rango es un grupo de celdas, por ejemplo A1:A5.']}
];
const categories=['Todo','Word','Excel','PowerPoint','Windows','Internet','Seguridad','Computación','Programación','Comandos'];
let active='Todo';const chips=document.getElementById('chips'),results=document.getElementById('results'),status=document.getElementById('status'),query=document.getElementById('query');
function makeChips(){categories.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>{active=c;makeChips();search()};chips.appendChild(b)})}
function search(){let q=query.value.trim().toLowerCase();let words=q.split(/\s+/).filter(w=>w.length>1);let found=knowledge.filter(k=>(active==='Todo'||k.cat===active)&&(!q||(k.title+' '+k.keys+' '+k.body+' '+(k.list||[]).join(' ')).toLowerCase().includes(q)));
if(q&&found.length===0){found=knowledge.filter(k=>(active==='Todo'||k.cat===active)&&words.some(w=>(k.title+' '+k.keys+' '+k.body+' '+(k.list||[]).join(' ')).toLowerCase().includes(w))).sort((a,b)=>{let score=k=>words.reduce((s,w)=>s+((k.title+' '+k.keys).toLowerCase().includes(w)?3:((k.body+' '+(k.list||[]).join(' ')).toLowerCase().includes(w)?1:0)),0);return score(b)-score(a)});}
results.innerHTML='';status.textContent=found.length?`${found.length} resultado(s)${q?' para “'+q+'”':''}.`:'No encontré una coincidencia exacta. Prueba con otras palabras o elige una categoría.';
found.slice(0,20).forEach(k=>{let article=document.createElement('article');article.className='result';article.innerHTML=`<span class="tag">${k.cat}</span><h2>${k.title}</h2><p>${k.body}</p>`+(k.list?'<ul>'+k.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'');results.appendChild(article)});
if(!q&&!found.length)results.innerHTML='<div class="empty">Prueba buscar: <b>atajos Word</b>, <b>Excel suma</b>, <b>comandos CMD</b>, <b>hardware</b> o <b>seguridad</b>.</div>';
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();search()});makeChips();search();
</script></body></html>
